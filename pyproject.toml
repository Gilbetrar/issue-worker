[project]
name = "issue-worker"
version = "0.1.0"
description = "CLI orchestrator for autonomous Claude Code sessions on GitHub issues"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
issue-worker = "issue_worker.cli:main"
issues = "issue_worker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/issue_worker"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "issue_worker/templates"
"defaults" = "issue_worker/defaults"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/templates",
    "/defaults",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/LEARNINGS.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"src/issue_worker/terminal.py" = ["E402"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.8",
]
